[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "park-studio"
version = "0.2.0"
description = "Park Studio — 开源本地内容生产线与多平台运营中控（选题、剪辑、发布、复盘）"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
park-studio = "park_studio.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
park_studio = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
