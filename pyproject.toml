[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "park-studio"
version = "0.1.0"
description = "Park Studio — 开源本地内容生产线与多平台运营中控（选题、拆解、写稿、审稿、多平台自动填表发布、运营大屏与同龄复盘）"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
park-studio = "park_studio.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
park_studio = ["static/**/*"]
